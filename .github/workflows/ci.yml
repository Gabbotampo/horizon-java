name: ci

# The gates every change must pass: formatting, clippy with warnings denied,
# the Rust tests and the corpus tools' Python tests. Corpus measurements need
# jars and a Horizon build, so they run elsewhere (real-mod-corpus.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: Vendored runtime (mod changes)
        # `mod/src/runtime/` is a copy of `crates/horizon-native-java/src` (the native mod is one
        # crate), recorded per file in `mod/vendor.lock`. Only a PR that touches the mod or the
        # tool must carry a current copy: a runtime-only PR is unaffected, because the mod carries
        # the commit its lock records until a mod PR refreshes it (`python3 tools/vendor.py`).
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # The base's tree only, so no merge base is needed in the shallow checkout.
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "::warning::could not fetch the base commit; skipping the vendored-copy check (the mod's lock check still runs in the Python tests)"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if ! printf '%s\n' "$changed" | grep -qE '^(mod/|tools/vendor\.py$)'; then
            echo "no mod/ or tools/vendor.py change: the mod's copy is not this PR's to refresh"
            exit 0
          fi
          python3 tools/vendor.py --check
      - name: Vendored runtime (main, warning only)
        # On main it reports a stale copy instead of failing the branch: the next mod PR (or a
        # release) refreshes it with `python3 tools/vendor.py`.
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 tools/vendor.py --check
      - name: Python tests
        # The fixture tests look for the debug binaries the step above built.
        run: python3 -m unittest discover -s tests

  # `mod/` is excluded from the workspace (the launcher builds it against Horizon's own lock), so
  # the workspace gates above never compile it. This job does, so a mod PR's green check means the
  # mod's code builds, lints clean and passes its unit tests.
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mod
      - name: Format (mod's own files)
        # mod/src/runtime/ is generated by tools/vendor.py (its `crate::` paths are rewritten, which
        # changes line lengths) and is pinned by mod/vendor.lock, so only the mod's own files are
        # formatted; the vendored copy is checked by `vendor.py --check-lock` in the Python tests.
        run: find mod/src -maxdepth 1 -name '*.rs' -print0 | xargs -0 rustfmt +stable --edition 2024 --check --config skip_children=true
      - name: Clippy (mod)
        run: cargo +stable clippy --manifest-path mod/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests (mod)
        run: cargo +stable test --manifest-path mod/Cargo.toml --lib
