name: ci

# The gates every change must pass: formatting, clippy with warnings denied,
# the Rust tests and the corpus tools' Python tests. Corpus measurements need
# jars and a Horizon build, so they run elsewhere (real-mod-corpus.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: Python tests
        # The fixture tests look for the debug binaries the step above built.
        run: python3 -m unittest discover -s tests
