[package]
name = "horizon-java-mod"
version = "0.1.0"
edition = "2024"
# zip 9.1.3 (below, the runtime's only non-trivial dependency) is `rust-version = "1.88"`.
rust-version = "1.88"
publish = false
description = "Horizon Java: runs Java mod jars on the native bytecode runtime"

[lib]
# The launcher links this crate into the game executable it builds.
path = "src/lib.rs"

[dependencies]
# The launcher rewrites this to the staged Horizon source it builds the game from, so the mod
# always calls the mod API of the exact game revision in `horizon-mod.toml`.
horizon-mod-api = { git = "https://github.com/arismoko/horizon", rev = "1376e3bcb68b771373ea75637b0201381ccfa6bd" }
# The runtime's two dependencies, pinned to the exact versions in Horizon's `Cargo.lock`
# (docs/modding/src/how-to/native-mods/016-the-mods-crate.md): a native mod may only use crates
# the locked game already resolves, at the same version.
serde_json = "=1.0.151"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
log = "0.4"
