[package]
name = "horizon-native-java"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.88"
description = "Native Rust probe for a bounded Fabric/NeoForge Java bytecode subset"

[dependencies]
serde_json = "=1.0.151"
# Horizon's own lock version (`mod/` runs this crate inside the game, and a native mod may only
# use crates the game resolves). zip 9 needs rustc 1.88 to build; Horizon's launcher ships 1.99.1.
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

# The thread's stack bounds, so the regex matcher's stack allowance is what is
# really left (`java_regex/stack.rs`). Pinned to the version Horizon's
# `Cargo.lock` already resolves, like the two above.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[lints]
workspace = true
